name: Publish FPS Global v1.0.1 release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.1.yml
      - RELEASE-NOTES-v1.0.1.md
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get verified ELF from completed private build artifact
        env:
          FPSG_ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-66cc-820e-a6fc-c12965c444ee/raw?se=2026-11-14T21%3A26%3A27Z&sp=r&sv=2026-06-06&sr=b&scid=74054afc-be07-576d-95a7-c89672a761a0&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-14T13%3A59%3A06Z&ske=2026-11-15T13%3A59%3A06Z&sks=b&skv=2026-06-06&sig=MY0vZR80ns8%2BDa6ZpeDTiTy9o29Qsb8OQM/0hBJBX/Q%3D"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 1 --connect-timeout 10 -o /tmp/fpsg-artifact.zip "$FPSG_ARTIFACT_URL"
          unzip -o /tmp/fpsg-artifact.zip -d /tmp/fpsg-package
          cp /tmp/fpsg-package/FPS-Global-v1.0.1-PS5-13.60.elf ./
          printf '%s  %s\n' '467012009cf65c4d3a28e4c3574dfbff9be129dedaf93ed31b8d517b4b618d2c' FPS-Global-v1.0.1-PS5-13.60.elf | sha256sum -c -
      - name: Publish or update existing v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v1.0.1 --repo "$GITHUB_REPOSITORY" --title "FPS Global v1.0.1 — PS5 13.60" --notes-file RELEASE-NOTES-v1.0.1.md
            gh release upload v1.0.1 FPS-Global-v1.0.1-PS5-13.60.elf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v1.0.1 FPS-Global-v1.0.1-PS5-13.60.elf --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FPS Global v1.0.1 — PS5 13.60" --notes-file RELEASE-NOTES-v1.0.1.md --latest
          fi
          gh release view v1.0.1 --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets --jq '{url,tagName,name,assets:[.assets[].name]}'
